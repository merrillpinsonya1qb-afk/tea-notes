          command: |
            cat /tmp/poetry/drafte186
      - run:
          name: Clone and prep
          command: git clone --depth 1 -q --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress bundle
          command: tar -xj -f main-pieces.tar.bz2
      - run:
          command: cmake --version
      - run:
          name: Settle filesystem
          command: ls -la
      - run:
